<style>
:root {
  /* Layout: one-screen explorer. Control bar on top, the tree canvas in the middle,
     item detail on the right (below the canvas on phones). Columns = depth layers. */
  --bg: #f3f5f7;
  --surface: #fbfcfd;
  --surface-2: #e9edf1;
  --ink: #0e1116;
  --ink-2: #4a5361;
  --muted: #727c8b;
  --line: #dde2e8;
  --accent: #2a78d6;
  --up: #eb6834;
  --down: #1baf7a;
  --edge: rgba(74, 83, 97, 0.17);
  --edge-dim: rgba(74, 83, 97, 0.06);
  --shadow: 0 8px 28px rgba(14, 17, 22, 0.12), 0 1px 2px rgba(14, 17, 22, 0.08);
  --seq: #86b6ef, #6da7ec, #5598e7, #3987e5, #2a78d6, #256abf, #1c5cab, #184f95, #104281, #0d366b;
  --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Space Grotesk", "Inter", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0e11;
    --surface: #14171b;
    --surface-2: #22272e;
    --ink: #eef1f4;
    --ink-2: #b6bfca;
    --muted: #8a94a2;
    --line: #2a3038;
    --accent: #3987e5;
    --up: #d95926;
    --down: #199e70;
    --edge: rgba(182, 191, 202, 0.13);
    --edge-dim: rgba(182, 191, 202, 0.045);
    --shadow: 0 8px 28px rgba(0, 0, 0, 0.5), 0 1px 2px rgba(0, 0, 0, 0.4);
    --seq: #184f95, #1c5cab, #256abf, #2a78d6, #3987e5, #5598e7, #6da7ec, #86b6ef, #9ec5f4, #b7d3f6, #cde2fb;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0e11;
  --surface: #14171b;
  --surface-2: #22272e;
  --ink: #eef1f4;
  --ink-2: #b6bfca;
  --muted: #8a94a2;
  --line: #2a3038;
  --accent: #3987e5;
  --up: #d95926;
  --down: #199e70;
  --edge: rgba(182, 191, 202, 0.13);
  --edge-dim: rgba(182, 191, 202, 0.045);
  --shadow: 0 8px 28px rgba(0, 0, 0, 0.5), 0 1px 2px rgba(0, 0, 0, 0.4);
  --seq: #184f95, #1c5cab, #256abf, #2a78d6, #3987e5, #5598e7, #6da7ec, #86b6ef, #9ec5f4, #b7d3f6, #cde2fb;
  color-scheme: dark;
}

html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font-ui); }
[hidden] { display: none !important; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }

.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { min-width: 0; }
.brand h1 { margin: 0; font: 600 19px/1.1 var(--font-display); letter-spacing: -0.01em; text-wrap: balance; }
.stats { margin: 3px 0 0; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

.tabs { display: flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: 9px; background: var(--surface-2); }
.tabs button {
  border: 0; background: transparent; color: var(--ink-2);
  padding: 5px 12px; border-radius: 7px; font-size: 13px; font-weight: 500;
}
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(14, 17, 22, 0.12); }

.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-left: auto; }
.field { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
.field select, .field input {
  font-size: 13px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px;
}
.field input { width: 190px; max-width: 100%; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); color: var(--ink-2); padding: 5px 12px; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); font-weight: 500; }

.body { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 340px; grid-template-rows: minmax(0, 1fr); }
.stage, .tablewrap { grid-area: 1 / 1; min-width: 0; min-height: 0; }
.stage { position: relative; overflow: hidden; background: var(--surface); }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
canvas.over { cursor: pointer; }
canvas.dragging { cursor: grabbing; }

.legend {
  position: absolute; left: 12px; bottom: 12px; display: grid; gap: 6px;
  padding: 10px 12px; width: 196px; max-width: calc(100% - 24px); box-sizing: border-box;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; font-size: 11.5px; color: var(--ink-2);
}
.lg-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.lg-title { font-weight: 600; color: var(--ink); }
.lg-note { color: var(--muted); }
.lg-bar { height: 8px; border-radius: 4px; }
.lg-ticks { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.lg-keys { display: grid; gap: 3px; padding-top: 6px; border-top: 1px solid var(--line); }
.lg-key { display: flex; align-items: center; gap: 8px; }
.line-key { width: 16px; height: 2px; border-radius: 1px; flex: none; }
.line-key.up { background: var(--up); }
.line-key.down { background: var(--down); }
.dot-key { width: 8px; height: 8px; border-radius: 50%; flex: none; box-sizing: border-box; border: 1.5px solid var(--muted); background: var(--surface); margin-inline: 4px; }
.dot-key.ring { border-color: var(--ink); }

.zoom { position: absolute; right: 12px; bottom: 12px; display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.zoom button { border: 0; background: transparent; color: var(--ink); min-width: 34px; height: 32px; font-size: 15px; padding: 0 10px; }
.zoom button + button { border-left: 1px solid var(--line); }
.zoom button:hover { background: var(--surface-2); }
.zoom .fit { font-size: 12.5px; }

.tip {
  position: absolute; left: 0; top: 0; pointer-events: none; z-index: 5;
  max-width: 280px; padding: 10px 12px; border-radius: 8px;
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow);
}
.tip-name { font: 600 14px/1.25 var(--font-display); color: var(--ink); }
.tip-sub { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.tip-grid { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin-top: 8px; font-size: 12.5px; }
.tip-grid .tv { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
.tip-grid .tl { color: var(--ink-2); }
.tip-grid .on { color: var(--accent); }
.tip-hint { margin-top: 8px; font-size: 11.5px; color: var(--muted); }

.tablewrap { overflow: auto; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
thead th { position: sticky; top: 0; z-index: 1; background: var(--surface); border-bottom: 1px solid var(--line); text-align: left; padding: 0; }
th button { width: 100%; border: 0; background: transparent; text-align: inherit; padding: 9px 14px; font-weight: 600; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
th[aria-sort] button { color: var(--ink); }
th[aria-sort="ascending"] button::after { content: " \2191"; }
th[aria-sort="descending"] button::after { content: " \2193"; }
td { padding: 6px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.num { text-align: right; }
tbody tr { cursor: pointer; }
tbody tr:hover, tbody tr:focus-visible { background: var(--surface-2); }
.empty-row td { color: var(--muted); cursor: default; }

.panel {
  grid-area: 1 / 2; min-width: 0; overflow: auto; background: var(--bg); border-left: 1px solid var(--line);
  padding-block: 16px 24px; padding-left: 18px;
  padding-right: max(18px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
.p-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.kicker { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.p-name { margin: -8px 0 0; font: 600 22px/1.15 var(--font-display); letter-spacing: -0.01em; text-wrap: balance; overflow-wrap: anywhere; }
.ghost { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 3px 10px; font-size: 12px; color: var(--ink-2); }
.ghost:hover { color: var(--ink); border-color: var(--muted); }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; }
.tile { flex: 1 1 84px; display: grid; align-content: start; gap: 1px; padding: 8px 10px; border-radius: 7px; background: var(--surface); border: 1px solid var(--line); }
.tiles.two .tile { flex-basis: 40%; }
.tile.on { border-color: var(--accent); }
.tile .tv { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tile .tl { font-size: 11.5px; color: var(--ink-2); }
.reach { margin: 0; display: grid; gap: 4px; font-size: 12.5px; color: var(--ink-2); }
.reach span { display: flex; align-items: center; gap: 8px; }
.sec { display: grid; gap: 8px; }
.sec h3 { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.caption { margin: -4px 0 0; font-size: 12px; color: var(--muted); }
.recipe { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; padding-top: 8px; border-top: 1px solid var(--line); }
.plus { color: var(--muted); font-size: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip {
  display: inline-flex; align-items: baseline; gap: 5px; max-width: 100%;
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 3px 10px; font-size: 12.5px; color: var(--ink); text-align: left;
}
.chip:hover { border-color: var(--accent); }
.chip .nm { overflow-wrap: anywhere; }
.chip .cnt { font-weight: 600; color: var(--ink-2); }
.chip .v { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.more { justify-self: start; }
.muted { margin: 0; color: var(--ink-2); font-size: 13px; }
.how { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); }
.notes { margin: 0; display: grid; gap: 8px; font-size: 13px; }
.notes dt { font-weight: 600; }
.notes dd { margin: 1px 0 0; color: var(--ink-2); }

@media (max-width: 760px) {
  .controls { margin-left: 0; }
  .body { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  .panel {
    grid-area: 2 / 1; max-height: 42vh; border-left: 0; border-top: 1px solid var(--line);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .legend { width: 170px; }
}
</style>

<div class="app">
  <header class="bar">
    <div class="brand">
      <h1>Toy Tech Trees</h1>
      <p class="stats" id="gameStats"></p>
    </div>
    <div class="tabs" id="gameTabs" role="tablist" aria-label="Game"></div>
    <div class="controls">
      <label class="field"><span class="sr">Find an item</span><input id="search" type="search" placeholder="Find an item" list="names" autocomplete="off"></label>

  <main class="body">

      <div class="legend" id="legend"></div>
      <div class="zoom">
        <button type="button" id="zoomOut" aria-label="Zoom out">&minus;</button>
        <button type="button" id="zoomIn" aria-label="Zoom in">+</button>
        <button type="button" id="zoomFit" class="fit">Fit</button>
      </div>
      <div class="tip" id="tip" hidden></div>

    <section class="tablewrap" id="tableView" hidden>
      <table id="table"><thead></thead><tbody></tbody></table>
    </section>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </main>
</div>

    }
    ctx.textAlign = 'left';
  }

  // ---------- view: pan, zoom, fit ----------
  function fitView() {
    const G = games[state.g], P = prep(G), L = cur();
    const LEFT = 96, RIGHT = 40;   // keep the first column clear of the axis title
    const w = (L.maxX - L.minX) + L.COL * 0.8;
    const h = 2 * L.half + ROW * 6;
    const k = Math.max(0.02, Math.min((W - LEFT - RIGHT) / w, (H - TOP - 32) / h));
    const tx = LEFT + Math.max(0, (W - LEFT - RIGHT) - w * k) / 2 - L.minX * k;
    P.views[state.layer] = { k, kMin: k * 0.6, tx, ty: TOP + (H - TOP) / 2 };
    return P.views[state.layer];
  }
  function view() {
    const P = prep(games[state.g]);
    return P.views[state.layer] || fitView();
  }
  function zoomAt(mx, my, f) {
    const V = view();
    const k2 = Math.min(14, Math.max(V.kMin, V.k * f));
    V.tx = mx - (mx - V.tx) * (k2 / V.k);
    V.ty = my - (my - V.ty) * (k2 / V.k);
    V.k = k2;
    draw();
  }
  function centerOn(i) {
    if (!W) { pendingCenter = i; return; }
    const L = cur(), V = view();
    const k2 = Math.max(V.k, 12 / ROW);
    const tx2 = W / 2 - L.x[i] * k2 - L.COL * k2 * 0.2;
    const ty2 = TOP + (H - TOP) / 2 - L.y[i] * k2;
    if (reduceMotion) { Object.assign(V, { k: k2, tx: tx2, ty: ty2 }); draw(); return; }
    const a = { k: V.k, tx: V.tx, ty: V.ty }, t0 = performance.now();
    const step = now => {
      const u = Math.min(1, (now - t0) / 320), e = 1 - Math.pow(1 - u, 3);
      V.k = a.k + (k2 - a.k) * e; V.tx = a.tx + (tx2 - a.tx) * e; V.ty = a.ty + (ty2 - a.ty) * e;
      draw();
      if (u < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  function hit(mx, my) {
    const L = cur(), V = view();
    const wx = (mx - V.tx) / V.k, wy = (my - V.ty) / V.k;
    const thr = Math.max(8, nodeRadius(V.k) + 4);
    let best = -1, bd = thr * thr;
    const v0 = Math.round(wx / L.COL);
    for (let v = v0 - 1; v <= v0 + 1; v++) {
      const c = L.cols.get(v);
      if (!c) continue;
      const q0 = Math.round(wy / ROW + (c.length - 1) / 2);
      for (let q = q0 - 2; q <= q0 + 2; q++) {
        if (q < 0 || q >= c.length) continue;
        const i = c[q];
        const dx = (L.x[i] - wx) * V.k, dy = (L.y[i] - wy) * V.k, d = dx * dx + dy * dy;
        if (d < bd) { bd = d; best = i; }
      }
    }
    return best;
  }

  // ---------- tooltip ----------
  function describe(G, P, i) {
    const nr = P.recipesOf[i].length, nu = P.succs[i].length;
    return `${nr ? plural(nr, 'recipe') : 'Starting item'} · used in ${plural(nu, 'item')}`;
  }
  function showTip(i, mx, my) {
    if (i < 0) { tip.hidden = true; return; }
    const G = games[state.g], P = prep(G);
    const grid = el('div', 'tip-grid');
    for (const m of metricsOf(G)) {
      grid.append(el('span', 'tv', fmt(G.metrics[m][i])), el('span', 'tl' + (m === state.color ? ' on' : ''), m));
    }
    tip.replaceChildren(el('div', 'tip-name', G.names[i]), el('div', 'tip-sub', describe(G, P, i)), grid,
      el('div', 'tip-hint', state.sel === i ? 'Pinned in the panel' : 'Click to pin it and trace its tree'));
    tip.hidden = false;
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let x = mx + 16, y = my + 16;
    if (x + tw > W - 8) x = mx - tw - 16;
    if (y + th > H - 8) y = H - th - 8;
    tip.style.transform = `translate(${Math.max(8, x)}px, ${Math.max(TOP + 4, y)}px)`;
  }

  // ---------- pointer input ----------
  const pointers = new Map();
  let drag = null, pinch = null, moved = false;
  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.offsetX, y: e.offsetY });
    if (pointers.size === 1) {
      const V = view();
      drag = { x: e.offsetX, y: e.offsetY, tx: V.tx, ty: V.ty };
      moved = false;
    } else if (pointers.size === 2) { drag = null; pinch = null; moved = true; }
  });
  canvas.addEventListener('pointermove', e => {
    if (pointers.has(e.pointerId)) {
      pointers.set(e.pointerId, { x: e.offsetX, y: e.offsetY });
      if (pointers.size === 2) {
        const [p1, p2] = [...pointers.values()];
        const d = Math.hypot(p1.x - p2.x, p1.y - p2.y), mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
        if (pinch && pinch.d > 0) {
          const V = view();
          zoomAt(mx, my, d / pinch.d);
          V.tx += mx - pinch.mx; V.ty += my - pinch.my;
        }
        pinch = { d, mx, my };
        return;
      }
      if (drag) {
        const dx = e.offsetX - drag.x, dy = e.offsetY - drag.y;
        if (!moved && Math.hypot(dx, dy) > 4) { moved = true; canvas.classList.add('dragging'); tip.hidden = true; }
        if (moved) { const V = view(); V.tx = drag.tx + dx; V.ty = drag.ty + dy; draw(); }
        return;
      }
    }
    if (e.pointerType === 'touch') return;
    const h = hit(e.offsetX, e.offsetY);
    canvas.classList.toggle('over', h >= 0);
    if (h !== state.hover) { state.hover = h; draw(); }
    showTip(h, e.offsetX, e.offsetY);
  });
  const release = e => {
    const wasClick = drag && !moved && pointers.size === 1;
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = null;
    if (wasClick && e.type === 'pointerup') select(hit(e.offsetX, e.offsetY));
    if (!pointers.size) { drag = null; canvas.classList.remove('dragging'); }
  };
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);
  canvas.addEventListener('pointerleave', () => {
    if (pointers.size) return;
    tip.hidden = true;
    canvas.classList.remove('over');
    if (state.hover >= 0) { state.hover = -1; draw(); }
  });
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    zoomAt(e.offsetX, e.offsetY, Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0015)));
  }, { passive: false });
  $('zoomIn').addEventListener('click', () => zoomAt(W / 2, (H + TOP) / 2, 1.5));
  $('zoomOut').addEventListener('click', () => zoomAt(W / 2, (H + TOP) / 2, 1 / 1.5));
  $('zoomFit').addEventListener('click', () => { fitView(); draw(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && state.sel >= 0) select(-1);
  });

  // ---------- selection & panel ----------
  function select(i, center = false) {
    state.sel = i;
    renderPanel();
    if (center && i >= 0) centerOn(i);
    draw();
  }

  function chip(G, i, prefix) {
    const b = el('button', 'chip');
    b.type = 'button';
    if (prefix) b.append(el('span', 'cnt', prefix));
    b.append(el('span', 'nm', G.names[i]));
    const v = G.metrics[state.color][i];
    b.append(el('span', 'v', fmt(v)));
    b.title = `${G.names[i]}: ${state.color} ${fmt(v)}`;
    b.addEventListener('click', () => select(i, true));
    b.addEventListener('pointerenter', () => { state.hover = i; draw(); });
    b.addEventListener('pointerleave', () => { if (state.hover === i) { state.hover = -1; draw(); } });
    return b;
  }
  function section(title) {
    const s = el('section', 'sec');
    s.append(el('h3', null, title));
    return s;
  }
  function chipList(G, items, key, limit = 40) {
    const wrap = el('div', 'chips');
    const all = state.showAll[key];
    for (const i of all ? items : items.slice(0, limit)) wrap.append(chip(G, i));
    const out = [wrap];
    if (items.length > limit && !all) {
      const more = el('button', 'ghost more', `Show all ${items.length.toLocaleString('en-US')}`);
      more.type = 'button';
      more.addEventListener('click', () => { state.showAll[key] = true; renderPanel(); });
      out.push(more);
    }
    return out;
  }
  function lineKey(cls, text) {
    const s = el('span');
    s.append(el('i', 'line-key ' + cls), document.createTextNode(text));
    return s;
  }

  function renderPanel() {
    const G = games[state.g], P = prep(G), i = state.sel;
    panel.replaceChildren();
    if (i < 0) { renderOverview(G, P); return; }
    const layerVals = G.metrics[state.layer];

    const top = el('div', 'p-top');
    const starting = !P.recipesOf[i].length;
    top.append(el('p', 'kicker', `${state.layer} ${fmt(layerVals[i])}${starting ? ' · starting item' : ''}`));
    const clear = el('button', 'ghost', 'Clear');
    clear.type = 'button';
    clear.addEventListener('click', () => select(-1));
    top.append(clear);
    panel.append(top, el('h2', 'p-name', G.names[i]));

    const tiles = el('div', 'tiles');
    for (const m of metricsOf(G)) {
      const t = el('div', 'tile' + (m === state.color ? ' on' : ''));
      t.append(el('span', 'tv', fmt(G.metrics[m][i])), el('span', 'tl', m));
      if (NOTES[m]) t.title = NOTES[m];
      tiles.append(t);
    }
    panel.append(tiles);

    const R = reach(G, i);
    const rl = el('p', 'reach');
    rl.append(lineKey('up', `Built from ${plural(R.nu, 'item')} upstream`), lineKey('down', `Leads to ${plural(R.nd, 'item')} downstream`));
    panel.append(rl);

    const rec = P.recipesOf[i];
    const rs = section(rec.length ? `Recipes (${rec.length.toLocaleString('en-US')})` : 'Recipes');
    if (!rec.length) {
      rs.append(el('p', 'muted', 'None in this network, so it is a starting item.'));
    } else {
      const deepest = ins => Math.max(...ins.map(x => layerVals[x] ?? 0));
      const sorted = [...rec].sort((a, b) => deepest(a) - deepest(b));
      if (sorted.length > 1) rs.append(el('p', 'caption', `Ordered by the ${state.layer.toLowerCase()} of each recipe's deepest ingredient, lowest first.`));
      const key = `rec${i}`, limit = 12;
      for (const ins of state.showAll[key] ? sorted : sorted.slice(0, limit)) {
        const row = el('div', 'recipe');
        const counts = new Map();
        for (const x of ins) counts.set(x, (counts.get(x) || 0) + 1);
        let first = true;
        for (const [x, c] of counts) {
          if (!first) row.append(el('span', 'plus', '+'));
          row.append(chip(G, x, c > 1 ? `${c}×` : null));
          first = false;
        }
        rs.append(row);
      }
      if (sorted.length > limit && !state.showAll[key]) {
        const more = el('button', 'ghost more', `Show all ${sorted.length.toLocaleString('en-US')} recipes`);
        more.type = 'button';
        more.addEventListener('click', () => { state.showAll[key] = true; renderPanel(); });
        rs.append(more);
      }
    }
    panel.append(rs);

    const uses = [...P.succs[i]].sort((a, b) => ((layerVals[a] ?? 0) - (layerVals[b] ?? 0)) || G.names[a].localeCompare(G.names[b]));
    const us = section(`Used in (${plural(uses.length, 'item')}, ${plural(P.usesCount[i], 'recipe')})`);
    if (!uses.length) us.append(el('p', 'muted', 'Nothing in this network is made from it.'));
    else us.append(...chipList(G, uses, `use${i}`));
    panel.append(us);

    if (G.pathways && G.pathways[i]) {
      const pw = G.pathways[i].filter(x => x !== i)
        .sort((a, b) => ((layerVals[a] ?? 0) - (layerVals[b] ?? 0)) || G.names[a].localeCompare(G.names[b]));
      const ps = section(`Assembly pathway (${plural(pw.length, 'item')})`);
      if (!pw.length) ps.append(el('p', 'muted', 'Nothing has to be built first.'));
      else ps.append(...chipList(G, pw, `pw${i}`));
      panel.append(ps);
    }
    panel.append(colorNote());
  }

  function colorNote() {
    return el('p', 'caption', `Grey numbers on the chips are ${state.color}.`);
  }

  function renderOverview(G, P) {
    const layerVals = G.metrics[state.layer];
    let starts = 0, deepest = 0;
    for (let i = 0; i < P.n; i++) {
      if (!P.recipesOf[i].length) starts++;
      if (layerVals[i] != null) deepest = Math.max(deepest, layerVals[i]);
    }
    panel.append(el('p', 'kicker', 'Overview'), el('h2', 'p-name', G.label));
    const tiles = el('div', 'tiles two');
    for (const [v, l] of [[P.n, 'items'], [G.recipes.length, 'recipes'], [starts, 'starting items'], [deepest, `max ${state.layer.toLowerCase()}`]]) {
      const t = el('div', 'tile');
      t.append(el('span', 'tv', fmt(v)), el('span', 'tl', l));
      tiles.append(t);
    }
    panel.append(tiles);

    const vals = G.metrics[state.color];
    const topItems = [...Array(P.n).keys()].filter(i => vals[i] != null).sort((a, b) => vals[b] - vals[a]).slice(0, 8);
    const hs = section(`Highest ${state.color}`);
    hs.append(...chipList(G, topItems, 'top'));
    panel.append(hs);

    const how = section('How to read it');
    const ul = el('ul', 'how');
    for (const line of [
      `Each column is one value of ${state.layer}. Starting items have no recipe and sit at 0.`,
      `Hover an item for its scores. Click it to pin it here and light up everything it is built from and everything it leads to.`,
      'Scroll or pinch to zoom and drag to pan. Names appear once you zoom in.',
      'The table view lists every item and sorts by any score.',
    ]) ul.append(el('li', null, line));
    how.append(ul);
    panel.append(how);

    const noted = metricsOf(G).filter(m => NOTES[m]);
    if (noted.length) {
      const ns = section('The scores');
      const dl = el('dl', 'notes');
      for (const m of noted) {
        const d = el('div');
        d.append(el('dt', null, m), el('dd', null, NOTES[m]));
        dl.append(d);
      }
      ns.append(dl);
      panel.append(ns);
    }
  }

  // ---------- legend ----------
  function renderLegend() {
    const G = games[state.g], sc = scale(G, state.color);
    const head = el('div', 'lg-head');
    head.append(el('span', 'lg-title', state.color));
    if (sc && sc.log) head.append(el('span', 'lg-note', 'log scale'));
    const parts = [head];
    if (sc) {
      const bar = el('div', 'lg-bar');
      const n = theme.seqHex.length;
      bar.style.background = `linear-gradient(90deg, ${theme.seqHex.map((c, i) => `${c} ${(i / (n - 1) * 100).toFixed(1)}%`).join(', ')})`;
      const tv = u => { const v = sc.inv(u); return sc.ints ? Math.round(v) : Math.round(v * 100) / 100; };
      const ticks = el('div', 'lg-ticks');
      ticks.append(el('span', null, fmt(sc.lo)), el('span', null, fmt(tv(0.5))), el('span', null, fmt(sc.hi)));
      parts.push(bar, ticks);
    }
    const keys = el('div', 'lg-keys');
    if (G.metrics[state.color].some(v => v == null)) {
      const k = el('div', 'lg-key');
      k.append(el('i', 'dot-key'), document.createTextNode('No value'));
      keys.append(k);
    }
    for (const [cls, text] of [['up', 'Built from (ingredients)'], ['down', 'Leads to (uses)']]) {
      const k = el('div', 'lg-key');
      k.append(el('i', 'line-key ' + cls), document.createTextNode(text));
      keys.append(k);
    }
    if (G.pathways) {
      const k = el('div', 'lg-key');
      k.append(el('i', 'dot-key ring'), document.createTextNode('On its assembly pathway'));
      keys.append(k);
    }
    parts.push(keys);
    legend.replaceChildren(...parts);
  }

  // ---------- table ----------
  function renderTable() {
    const G = games[state.g], P = prep(G), ms = metricsOf(G);
    const cols = [['name', 'Item'], ...ms.map(m => [m, m]), ['recipes', 'Recipes'], ['uses', 'Used in (items)']];
    const val = (key, i) => key === 'name' ? G.names[i] : key === 'recipes' ? P.recipesOf[i].length
      : key === 'uses' ? P.succs[i].length : G.metrics[key][i];
    const sortKey = state.sortKey && cols.some(c => c[0] === state.sortKey) ? state.sortKey : state.color;
    const dir = state.sortKey === sortKey ? state.sortDir : -1;

    const tr = el('tr');
    for (const [key, label] of cols) {
      const th = el('th', key === 'name' ? null : 'num');
      th.scope = 'col';
      if (key === sortKey) th.setAttribute('aria-sort', dir > 0 ? 'ascending' : 'descending');
      const b = el('button', null, label);
      b.type = 'button';
      b.addEventListener('click', () => {
        if (sortKey === key) { state.sortKey = key; state.sortDir = -dir; }
        else { state.sortKey = key; state.sortDir = key === 'name' ? 1 : -1; }
        renderTable();
      });
      th.append(b);
      tr.append(th);
    }
    table.tHead.replaceChildren(tr);

    const q = search.value.trim().toLowerCase();
    const rows = [...Array(P.n).keys()].filter(i => !q || P.lower[i].includes(q));
    rows.sort((a, b) => {
      const va = val(sortKey, a), vb = val(sortKey, b);
      if (va == null || vb == null) return va == null ? (vb == null ? a - b : 1) : -1;
      return (typeof va === 'string' ? va.localeCompare(vb) : va - vb) * dir || a - b;
    });
    const frag = document.createDocumentFragment();
    for (const i of rows) {
      const row = el('tr');
      row.dataset.i = i;
      row.tabIndex = 0;
      for (const [key] of cols) row.append(el('td', key === 'name' ? null : 'num', key === 'name' ? G.names[i] : fmt(val(key, i))));
      frag.append(row);
    }
    if (!rows.length) {
      const row = el('tr', 'empty-row');
      const td = el('td', null, `No item matches “${search.value.trim()}”.`);
      td.colSpan = cols.length;
      row.append(td);
      frag.append(row);
    }
    table.tBodies[0].replaceChildren(frag);
  }
  const openRow = row => {
    if (!row || row.dataset.i == null) return;
    setView('tree');
    select(Number(row.dataset.i), true);
  };
  table.tBodies[0].addEventListener('click', e => openRow(e.target.closest('tr')));
  table.tBodies[0].addEventListener('keydown', e => { if (e.key === 'Enter') openRow(e.target.closest('tr')); });

  // ---------- controls ----------
  function setView(v) {
    state.view = v;
    stage.hidden = v !== 'tree';
    $('tableView').hidden = v !== 'table';
    $('viewTree').setAttribute('aria-pressed', String(v === 'tree'));
    $('viewTable').setAttribute('aria-pressed', String(v === 'table'));
    if (v === 'table') renderTable();
    else draw();
  }
  $('viewTree').addEventListener('click', () => setView('tree'));
  $('viewTable').addEventListener('click', () => setView('table'));

  function fillSelect(sel, options, value) {
    sel.replaceChildren(...options.map(m => { const o = el('option', null, m); o.value = m; return o; }));
    sel.value = value;
  }

  function setGame(k) {
    state.g = k;
    state.sel = -1;
    state.hover = -1;
    state.showAll = {};
    tip.hidden = true;
    const G = games[k], P = prep(G), ms = metricsOf(G);
    if (!G.layers.includes(state.layer)) state.layer = G.layers[0];
    if (!ms.includes(state.color)) state.color = ['Assembly Index', 'Assembly'].find(m => ms.includes(m)) || ms[0];
    fillSelect(colorSel, ms, state.color);
    fillSelect(layerSel, G.layers, state.layer);
    [...$('gameTabs').children].forEach((b, j) => b.setAttribute('aria-selected', String(j === k)));
    $('gameStats').textContent = `${plural(P.n, 'item')} · ${plural(G.recipes.length, 'recipe')}`;
    $('names').replaceChildren(...G.names.map(n => { const o = el('option'); o.value = n; return o; }));
    renderLegend();
    renderPanel();
    if (state.view === 'table') renderTable();
    draw();
  }

  games.forEach((G, k) => {
    const b = el('button', null, G.label);
    b.type = 'button';
    b.setAttribute('role', 'tab');
    b.addEventListener('click', () => setGame(k));
    $('gameTabs').append(b);
  });
  colorSel.addEventListener('change', () => {
    state.color = colorSel.value;
    renderLegend();
    renderPanel();
    if (state.view === 'table') { state.sortKey = null; renderTable(); }
    draw();
  });
  layerSel.addEventListener('change', () => {
    state.layer = layerSel.value;
    renderPanel();
    if (state.sel >= 0) centerOn(state.sel);
    draw();
  });

  const find = () => {
    const q = search.value.trim().toLowerCase();
    if (!q || state.view !== 'tree') return;
    const P = prep(games[state.g]);
    let i = P.lower.indexOf(q);
    if (i < 0) i = P.lower.findIndex(s => s.includes(q));
    if (i >= 0) select(i, true);
  };
  search.addEventListener('input', () => {
    if (state.view === 'table') renderTable();
    else if (prep(games[state.g]).lower.includes(search.value.trim().toLowerCase())) find();
  });
  search.addEventListener('keydown', e => { if (e.key === 'Enter') find(); });

  // ---------- theme & size ----------
  const retheme = () => { readTheme(); colorCache.clear(); renderLegend(); draw(); };
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', retheme);
  new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  new ResizeObserver(() => {
    const r = stage.getBoundingClientRect();
    W = r.width; H = r.height;
    if (!W || !H) return;
    dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    if (pendingCenter >= 0) { const i = pendingCenter; pendingCenter = -1; centerOn(i); }
    render();
  }).observe(stage);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { clipCache.clear(); draw(); });

  readTheme();
  setGame(0);
})();
</script>
